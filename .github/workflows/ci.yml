name: ci

# Default (synthetic) test suite. The protected journal and attempt-directory
# tests run when the token is elevated, as on the Windows runner, and skip
# otherwise. TestMyStoreBindingLive runs only with KEPPIN_STORE_LIVE=1, which CI
# does not set. Live enrollment is validated separately.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go version
        run: go version
      - name: build
        run: go build ./...
      - name: vet (amd64)
        run: go vet ./...
      - name: vet (386)
        run: GOARCH=386 go vet ./...
      - name: test
        # Verbose, so the log names each protected test as PASS or SKIP.
        run: go test ./... -count=1 -v

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go version
        run: go version
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reports:"
            echo "$unformatted"
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
